<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: lightgray;
        }

        .container {
            background: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
            background-color: blue;
            color: white;
            border: none;
        }

        #result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Even or Odd Checker</h2>

        <input type="number" id="num" placeholder="Enter a number">

        <br>

        <button onclick="checkNumber()">Check</button>

        <p id="result"></p>
    </div>

    <script>
        function checkNumber() {
            let number = document.getElementById("num").value;

            if (number === "") {
                document.getElementById("result").innerHTML = " enter  number";
                return;
            }

            if (number % 2 === 0) {
                document.getElementById("result").innerHTML = number + " is Even";
            } else {
                document.getElementById("result").innerHTML = number + " is Odd";
            }
        }
    </script>

</body>
</html>
